[client]
showSidebarNavigation = false

[theme]
base = "dark"
backgroundColor = "#070b14"
secondaryBackgroundColor = "#0c1322"
textColor = "#e6ecf7"
primaryColor = "#00d4ff"
[server]
maxUploadSize = 50
headless = true
port = 8501
# Fix for Windows address binding issue
address = "localhost"
enableCORS = false
enableXsrfProtection = false

[browser]
gatherUsageStats = false