 [theme]
 base = "dark"
 backgroundColor = "#0a0e1a"
 secondaryBackgroundColor = "#0f1525"
 textColor = "#e0e6f0"
 primaryColor = "#00d4ff"
[server]
maxUploadSize = 50
headless = true
port = 8501
# Fix for Windows address binding issue
address = "localhost"
enableCORS = false
enableXsrfProtection = false

[browser]
gatherUsageStats = false